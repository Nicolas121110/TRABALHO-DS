<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANHM | CARRINHO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Página Inicial/carrinho/carro.css">
</head>

<body>
    
<!--NAVEGAÇÃO E CABEÇALHO-->
    <header class="cabecalho">

        <div class="barra-branca">
            
            <nav>
                <a href="/Página Inicial/PI.html">HOME</a>
                <a href="/Página sobre/PS.html">SOBRE NÓS</a>
                <a href="/Página Contato/PC.html">CONTATO</a>
            </nav>

            <div class="icones-topo">
                <img src="/Página Inicial/ROBO.png" alt="Robô ANHM">
            </div>

        </div>

        <div class="area-logo"><img src="/Página Inicial/LOGO.png" alt="Logo ANHM"></div>

    </header>

<!--ÁREA DO CARRINHO/CORPO-->
    <main class="carrinho">

        <h1>Meu Carrinho</h1>
        <div id="lista-carrinho"></div>

        <div class="resumo">
            <h2>Resumo da compra</h2>
            <p>Produtos:<strong id="quantidade">0</strong></p>
            <p class="total">Total:<strong id="total">R$ 0,00</strong></p>
            <button type="button" class="btn btn-success" onclick="finalizarCompra()">Finalizar Compra</button>
            <button class="btn btn-outline-danger limpar" onclick="limparCarrinho()">Limpar carrinho</button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Página Inicial/carrinho/carro.js"></script>

</body>

</html>
